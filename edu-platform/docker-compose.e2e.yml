# Local E2E override: keep infrastructure ports inside the Compose network so
# this project can run alongside other PostgreSQL/Redis/MinIO stacks.
services:
  postgres:
    ports: !override
      - "15432:5432"
  redis:
    ports: !override
      - "16379:6379"
  minio:
    ports: !override
      - "19000:9000"
      - "19001:9001"
