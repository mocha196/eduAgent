# Local services for edu-platform.
# Usage: docker compose up -d
# Then set DATABASE_URL in .env to match POSTGRES_* below.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: edu-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu
      POSTGRES_DB: edu_platform
    ports:
      - "5432:5432"
    volumes:
      - edu_platform_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu -d edu_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edu-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - edu_platform_redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: edu-platform-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_minio_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - edu_platform_minio:/data

  rag-service:
    image: ghcr.io/${GITHUB_OWNER}/edu-rag-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: edu-platform/Dockerfile.rag-service
    container_name: edu-platform-rag-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # Keep rag-service container-safe defaults (service names on compose network).
      # This avoids .env localhost values accidentally breaking in-container connections.
      DATABASE_URL: ${RAG_SERVICE_DATABASE_URL:-postgresql://edu:edu@postgres:5432/edu_platform?schema=public}
      RAG_PG_DSN: ${RAG_SERVICE_PG_DSN:-postgresql://edu:edu@postgres:5432/edu_rag}
      RAG_SERVICE_API_KEY: ${RAG_SERVICE_API_KEY}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      # Internal notification webhook (Next.js → rag-service callback)
      NEXTJS_INTERNAL_URL: ${NEXTJS_INTERNAL_URL:-http://nextjs:3000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  rag-worker:
    image: ghcr.io/${GITHUB_OWNER}/edu-rag-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: edu-platform/Dockerfile.rag-service
    container_name: edu-platform-rag-worker
    restart: unless-stopped
    command: ["uv", "run", "edu-rag-worker"]
    environment:
      DATABASE_URL: ${RAG_SERVICE_DATABASE_URL:-postgresql://edu:edu@postgres:5432/edu_platform?schema=public}
      RAG_PG_DSN: ${RAG_SERVICE_PG_DSN:-postgresql://edu:edu@postgres:5432/edu_rag}
      REDIS_URL: ${RAG_WORKER_REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${RAG_WORKER_MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_minio_minio}
      MINIO_BUCKET: ${MINIO_BUCKET:-edu-materials}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      RAG_SERVICE_API_KEY: ${RAG_SERVICE_API_KEY}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      MINERU_CLOUD_API_KEY: ${MINERU_CLOUD_API_KEY:-}
      MINERU_CLOUD_ENABLED: ${MINERU_CLOUD_ENABLED:-false}
      NEXTJS_INTERNAL_URL: ${NEXTJS_INTERNAL_URL:-http://nextjs:3000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Next.js application
  # ---------------------------------------------------------------------------

  nextjs:
    image: ghcr.io/${GITHUB_OWNER}/edu-platform-nextjs:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edu-platform-nextjs
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Container-safe defaults (use compose service names instead of localhost)
      DATABASE_URL: ${NEXTJS_DATABASE_URL:-postgresql://edu:edu@postgres:5432/edu_platform?schema=public}
      REDIS_URL: ${NEXTJS_REDIS_URL:-redis://redis:6379}
      RAG_SERVICE_URL: ${NEXTJS_RAG_SERVICE_URL:-http://rag-service:8001}
      MINIO_ENDPOINT: ${NEXTJS_MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_minio_minio}
      MINIO_BUCKET: ${MINIO_BUCKET:-edu-materials}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      # Required secrets — must be set in .env
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RAG_SERVICE_API_KEY: ${RAG_SERVICE_API_KEY}
      # LLM providers (fall through to defaults if unset)
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_CHAT_API_KEY: ${LLM_CHAT_API_KEY:-}
      LLM_CHAT_BASE_URL: ${LLM_CHAT_BASE_URL:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
      LLM_COMPLETION_API_KEY: ${LLM_COMPLETION_API_KEY:-}
      LLM_COMPLETION_BASE_URL: ${LLM_COMPLETION_BASE_URL:-}
      LLM_COMPLETION_MODEL: ${LLM_COMPLETION_MODEL:-}
      LLM_VISION_API_KEY: ${LLM_VISION_API_KEY:-}
      LLM_VISION_BASE_URL: ${LLM_VISION_BASE_URL:-}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rag-service:
        condition: service_started
      rag-worker:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Review Scheduler — triggers daily memory review sessions per user timezone
  # ---------------------------------------------------------------------------

  review-scheduler:
    image: ghcr.io/${GITHUB_OWNER}/edu-platform-nextjs:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edu-platform-review-scheduler
    restart: unless-stopped
    command: ["npx", "tsx", "scripts/review-scheduler.ts"]
    environment:
      NEXTJS_INTERNAL_URL: ${NEXTJS_INTERNAL_URL:-http://nextjs:3000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MEMORY_REVIEW_QUESTION_COUNT: ${MEMORY_REVIEW_QUESTION_COUNT:-5}
    depends_on:
      - nextjs

  # Cloudflare Named Tunnel — exposes nextjs:3000 via a fixed public URL.
  # Set CLOUDFLARE_TUNNEL_TOKEN in .env (obtain from Cloudflare Zero Trust dashboard).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: edu-platform-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nextjs

volumes:
  edu_platform_pgdata:
  edu_platform_redisdata:
  edu_platform_minio:
