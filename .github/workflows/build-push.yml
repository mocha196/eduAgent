name: Build & Push Docker Images

on:
  push:
    branches: [main]

jobs:
  build-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Next.js image
        uses: docker/build-push-action@v6
        with:
          context: ./edu-platform
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/edu-platform-nextjs:latest
            ghcr.io/${{ github.repository_owner }}/edu-platform-nextjs:sha-${{ github.sha }}

      - name: Build & push RAG service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./edu-platform/Dockerfile.rag-service
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/edu-rag-service:latest
            ghcr.io/${{ github.repository_owner }}/edu-rag-service:sha-${{ github.sha }}
